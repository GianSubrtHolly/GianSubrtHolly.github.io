media:
  input: assets/images/projects
  output: /assets/images/projects

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{slug}.json"
    view:
      layout: tree
      primary: title
      fields: [title, category]
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Web address name
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Use lowercase letters, numbers, and hyphens only.
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - label: Materials
              value: materials
            - label: 3D Models
              value: models
            - label: Environmental Art
              value: environmental
            - label: Lighting Art
              value: lighting
            - label: Technical Art
              value: technical
      - name: description
        label: Short description
        type: text
        required: true
      - name: titleLine
        label: Italic title line
        type: string
        required: false
      - name: heroImage
        label: Header image
        type: image
        required: true
      - name: heroAlt
        label: Header image description
        type: string
        required: true
      - name: heroWidth
        label: Header image width in pixels
        type: number
        required: false
        description: Optional. Leave blank to use the default responsive size.
      - name: heroHeight
        label: Header image height in pixels
        type: number
        required: false
        description: Optional. Leave blank to use the default responsive size.
      - name: lede
        label: Large introductory text
        type: text
        required: true
      - name: mainText
        label: Main text
        type: text
        required: true
      - name: role
        label: Role
        type: text
        required: false
      - name: tools
        label: Tools
        type: text
        required: false
      - name: image
        label: Card image style
        type: select
        required: true
        options:
          values:
            - label: Garden
              value: image-garden
            - label: Ember
              value: image-ember
            - label: Orbital
              value: image-orbit
      - name: cardImage
        label: Card preview image
        type: image
        required: false
        description: Optional upload. If blank, the selected card image style is used.
      - name: sections
        label: Page sections
        type: block
        list:
          collapsible: true
          summary: "{{block.heading}}"
        blocks:
          - name: text
            label: Text
            fields:
              - name: heading
                label: Section heading
                type: string
                required: false
              - name: body
                label: Text
                type: text
                required: true
          - name: subheader
            label: Subheader
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: body
                label: Supporting text
                type: text
                required: false
          - name: image
            label: Image
            fields:
              - name: image
                label: Picture
                type: image
                required: true
              - name: alt
                label: Picture description
                type: string
                required: true
              - name: caption
                label: Caption
                type: string
                required: false
          - name: image-link
            label: Image with link
            fields:
              - name: image
                label: Picture
                type: image
                required: true
              - name: alt
                label: Picture description
                type: string
                required: true
              - name: url
                label: Link URL
                type: string
                required: true
                pattern:
                  regex: '^(https://|/|[a-z0-9-]+\\.html(?:$|[?#]))'
                  message: Use an HTTPS link or a local page.
              - name: caption
                label: Caption
                type: string
                required: false
          - name: video
            label: Video
            fields:
              - name: video
                label: Video file
                type: file
                required: true
              - name: caption
                label: Caption
                type: string
                required: false
          - name: embed
            label: Embed
            fields:
              - name: url
                label: Embed URL
                type: string
                required: true
                pattern:
                  regex: '^https://'
                  message: Embeds must use HTTPS.
              - name: title
                label: Embed title
                type: string
                required: true
              - name: height
                label: Height
                type: number
                required: false
