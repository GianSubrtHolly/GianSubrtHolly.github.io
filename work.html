<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Games art projects by Gian Subrt Holly">
  <title>Projects | Gian Subrt Holly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Gian Subrt Holly home">GSH<span class="brand-mark">+</span></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a><a href="games.html">Games</a><a class="active" href="work.html">Projects</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="special-thanks.html">Special thanks</a>
    </nav>
  </header>
  <main class="page-shell test-page">
    <div class="test-intro"><h1>Projects</h1><p>Choose a category to load its projects beside it.</p></div>
    <div class="test-layout">
      <aside class="test-categories" aria-label="Project categories">
        <button class="test-category is-active" type="button" data-category="materials">Materials <span>↗</span></button>
        <button class="test-category" type="button" data-category="models">3D Models <span>↗</span></button>
        <button class="test-category" type="button" data-category="environmental">Environmental Art <span>↗</span></button>
        <button class="test-category" type="button" data-category="lighting">Lighting Art <span>↗</span></button>
        <button class="test-category" type="button" data-category="technical">Technical Art <span>↗</span></button>
      </aside>
      <section class="test-project-panel" aria-live="polite" aria-label="Projects in selected category">
        <div class="test-panel-heading"><p id="test-category-name">Materials</p><span id="test-project-count">0 projects</span></div>
        <div class="test-project-scroll" id="test-project-list"></div>
      </section>
    </div>
  </main>
  <script>
    const categoryLabels = { materials: 'Materials', models: '3D Models', environmental: 'Environmental Art', lighting: 'Lighting Art', technical: 'Technical Art' };
    const imageStyles = ['image-garden', 'image-ember', 'image-orbit'];
    const localProjectImage = (value) => {
      const image = String(value || '');
      return /^\/?assets\/images\/projects\/[A-Za-z0-9._/-]+$/.test(image) && !image.includes('..') ? `/${image.replace(/^\//, '')}` : '';
    };
    const projectSlug = (value) => /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(String(value || '')) ? String(value) : '';
    let projects = [];
    const projectList = document.querySelector('#test-project-list');
    const categoryName = document.querySelector('#test-category-name');
    const projectCount = document.querySelector('#test-project-count');
    function showCategory(category) {
      const categoryProjects = projects.filter((project) => project.category === category && projectSlug(project.slug));
      categoryName.textContent = categoryLabels[category];
      projectCount.textContent = `${categoryProjects.length} ${categoryProjects.length === 1 ? 'project' : 'projects'}`;
      projectList.replaceChildren();
      if (!categoryProjects.length) {
        const emptyState = document.createElement('div');
        emptyState.className = 'category-empty';
        emptyState.innerHTML = '<span>No published projects yet</span><span>+</span>';
        projectList.append(emptyState);
        return;
      }
      categoryProjects.forEach((project, index) => {
        const card = document.createElement('a');
        card.className = 'test-project-card';
        card.href = `project.html?slug=${encodeURIComponent(projectSlug(project.slug))}`;
        card.setAttribute('aria-label', `Open ${project.title} project`);
        const image = document.createElement('span');
        image.className = `test-project-image ${imageStyles.includes(project.image) ? project.image : imageStyles[index % imageStyles.length]}`;
        const cardImage = localProjectImage(project.cardImage);
        if (cardImage) image.style.setProperty('--project-image', `url("${cardImage}")`);
        const number = document.createElement('span');
        number.textContent = String(index + 1).padStart(2, '0');
        image.append(number);
        const copy = document.createElement('span');
        copy.className = 'test-project-copy';
        const title = document.createElement('strong');
        title.textContent = project.title;
        const description = document.createElement('small');
        description.textContent = project.description || categoryLabels[category];
        copy.append(title, description);
        card.append(image, copy);
        const arrow = document.createElement('span');
        arrow.className = 'test-project-arrow';
        arrow.textContent = '↗';
        card.append(arrow);
        projectList.append(card);
      });
    }
    document.querySelectorAll('.test-category').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelector('.test-category.is-active').classList.remove('is-active');
        button.classList.add('is-active');
        showCategory(button.dataset.category);
      });
    });
    fetch('content/projects.json')
      .then((response) => response.json())
      .then((data) => {
        projects = Array.isArray(data.projects) ? data.projects : [];
        showCategory('materials');
      })
      .catch(() => showCategory('materials'));
  </script>
  <footer class="site-footer page-shell"><p>© 2026 Gian Subrt Holly</p><p>Based in Europe / Working worldwide</p></footer>
</body>
</html>
