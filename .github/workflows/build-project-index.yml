name: Build project index

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'scripts/build-project-index.mjs'
      - '.github/workflows/build-project-index.yml'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action context
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build project index
        run: node scripts/build-project-index.mjs
      - name: Commit project index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/projects.json
          git diff --cached --quiet || git commit -m 'Build project index'
          git push
